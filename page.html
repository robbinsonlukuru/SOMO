<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1a7a4a"><title>Somo Kenya LMS</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"></head>
<body><div class="shell"><aside class="sidebar"><div class="logo-area"><a class="logo-mark" href="index.html" style="text-decoration:none"><div class="logo-icon">📘</div><div><div class="logo-name">Somo</div><div class="logo-sub">Kenya LMS</div></div></a></div><div id="navigation"></div><div class="sidebar-footer"><a class="user-chip" href="page.html?view=settings" style="text-decoration:none"><div class="avatar">JW</div><div class="user-info"><div class="user-name">James Waweru</div><div class="user-role">Form 3 · Nairobi School</div></div></a></div></aside><main class="main"><header class="topbar"><button class="icon-btn mobile-menu" aria-label="Toggle navigation" data-action="menu"><i class="ti ti-menu-2"></i></button><span class="page-title" id="page-title">Somo</span><div class="search-bar"><i class="ti ti-search"></i><input id="search" type="search" placeholder="Search courses, assignments…" aria-label="Search"><div id="search-results" hidden></div></div><div class="top-actions"><a class="icon-btn notif-dot" href="page.html?view=notifications" aria-label="Notifications"><i class="ti ti-bell"></i></a><a class="icon-btn" href="page.html?view=help" aria-label="Help"><i class="ti ti-help"></i></a></div></header><div class="content" id="page"></div></main></div><script type="module" src="app.js"></script><script>
const groups=[["Main",["dashboard","Dashboard","layout-dashboard"],["courses","My Courses","book-2"],["schedule","Schedule","calendar-event"],["assignments","Assignments","clipboard-list"],["grades","Grades","chart-bar"]],["Community",["messages","Messages","messages"],["announcements","Announcements","speakerphone"],["groups","Study Groups","users"]],["Resources",["resources","KNEC Resources","file-text"],["settings","Settings","settings"],["teacher","Teacher Portal","school"]]];
const active=new URLSearchParams(location.search).get("view")||"dashboard";
document.querySelector("#navigation").innerHTML=groups.map(g=>'<div class="nav-section"><div class="nav-label">'+g[0]+'</div>'+g.slice(1).map(i=>'<a class="nav-item '+(active===i[0]?'active':'')+'" href="page.html?view='+i[0]+'"><i class="ti ti-'+i[2]+'"></i>'+i[1]+'</a>').join("")+'</div>').join("");
document.querySelector('[data-action="menu"]').addEventListener("click",()=>document.querySelector(".sidebar").classList.toggle("open"));
</script></body></html>
